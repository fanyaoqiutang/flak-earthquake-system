<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震预警与科普平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 20px;
        }
        .page-wrap {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        /* 左侧侧边栏 */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* 右侧主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
            border-left: 4px solid #409eff;
            padding-left: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 9px 12px;
            margin: 6px 0;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #409eff;
        }
        button {
            background-color: #409eff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            margin: 6px 4px 6px 0;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #338ecc;
        }
        button.danger {
            background-color: #f56c6c;
        }
        button.danger:hover {
            background-color: #e05555;
        }
        button.success {
            background-color: #67C23A;
        }
        button.success:hover {
            background-color: #55a830;
        }
        .status {
            margin-top: 8px;
            padding: 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .status.logged-in {
            background-color: #f0f9ff;
            color: #409eff;
            border: 1px solid #d9ecff;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 14px 26px;
            border-radius: 8px;
            font-size: 15px;
            z-index: 9999;
            display: none;
        }
        .eq-list {
            max-height: 320px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .eq-item {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            line-height: 1.5;
        }
        .empty-tip {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        #chat_box {
            height: 180px;
            border: 1px solid #eee;
            padding: 10px;
            overflow-y: scroll;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .row-group {
            display: flex;
            gap: 15px;
        }
        .row-group .card {
            flex: 1;
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <!-- 左侧侧边栏 -->
    <div class="sidebar">
        <!-- 用户登录 -->
        <div class="card">
            <h2>普通用户登录</h2>
            <input type="text" id="user_account" placeholder="账号">
            <input type="password" id="user_pwd" placeholder="密码">
            <button onclick="userReg()">注册</button>
            <button onclick="userLogin()">登录</button>
            <button class="danger" onclick="userLogout()">登出</button>
            <div id="user_status"></div>
        </div>

        <!-- 管理员登录 -->
        <div class="card">
            <h2>管理员操作</h2>
            <input type="text" id="admin_account" placeholder="管理员账号">
            <input type="password" id="admin_pwd" placeholder="密码">
            <input type="text" id="admin_key" placeholder="管理密钥">
            <button onclick="adminReg()">注册</button>
            <button onclick="adminLogin()">登录</button>
            <button class="danger" onclick="adminLogout()">登出</button>
            <div id="admin_status"></div>
        </div>

        <!-- 订阅预警 -->
        <div class="card">
            <h2>订阅与预警</h2>
            <input type="number" id="sub_province_id" placeholder="省份ID">
            <button onclick="subscribe()">订阅省份</button>
            <button onclick="showMySubscriptions()">我的订阅</button>
            <button onclick="showAlerts()">查看预警</button>
            <div id="result" style="margin-top:10px;font-size:14px;"></div>
        </div>
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-content">
        <!-- 地震数据展示 -->
        <div class="card">
            <h2>地震消息列表</h2>
            <button class="success" onclick="loadEarthquakeList()">刷新数据</button>
            <div id="eq_list_container" class="eq-list">
                <div class="empty-tip">点击刷新加载数据</div>
            </div>
        </div>

        <!-- 地震增删改 -->
        <div class="row-group">
            <div class="card">
                <h2>新增地震信息</h2>
                <input type="number" id="province_id" placeholder="省份ID">
                <input type="text" id="earthquake_time" placeholder="地震时间">
                <input type="text" id="latitude" placeholder="纬度">
                <input type="text" id="longitude" placeholder="经度">
                <input type="text" id="depth" placeholder="深度">
                <input type="text" id="magnitude" placeholder="震级">
                <input type="text" id="earthquake_message" placeholder="描述信息">
                <button onclick="addEarthquake()">提交新增</button>
            </div>
            <div class="card">
                <h2>编辑地震信息</h2>
                <input type="number" id="eq_id" placeholder="目标地震ID">
                <input type="number" id="update_province" placeholder="新省份ID">
                <input type="text" id="update_time" placeholder="新时间">
                <input type="text" id="update_lat" placeholder="新纬度">
                <input type="text" id="update_lng" placeholder="新经度">
                <input type="text" id="update_depth" placeholder="新深度">
                <input type="text" id="update_mag" placeholder="新震级">
                <input type="text" id="update_msg" placeholder="新描述">
                <button onclick="updateEarthquake()">修改</button>
                <button class="danger" onclick="deleteEarthquake()">删除</button>
            </div>
        </div>

        <!-- 聊天+反馈并排 -->
        <div class="row-group">
            <div class="card">
                <h2>公共聊天室</h2>
                <div id="chat_box"></div>
                <input id="chat_msg" type="text" placeholder="输入消息">
                <button onclick="sendChat()">发送消息</button>
            </div>
            <div class="card">
                <h2>用户反馈</h2>
                <select id="fb_type">
                    <option value="故障问题">故障问题</option>
                    <option value="功能建议">功能建议</option>
                    <option value="投诉">投诉</option>
                </select>
                <select id="fb_priority">
                    <option value="低">低</option>
                    <option value="中" selected>中</option>
                    <option value="高">高</option>
                </select>
                <textarea id="fb_content" rows="5" placeholder="填写反馈内容"></textarea>
                <button onclick="submitFeedback()">提交反馈</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<script>
let currentUserToken = null;
let currentAdminToken = null;

window.onload = function () {
    const u = localStorage.getItem("user_token");
    const a = localStorage.getItem("admin_token");
    if (u) { currentUserToken = u; updateUserStatus(localStorage.getItem("user_account")); }
    if (a) { currentAdminToken = a; updateAdminStatus(localStorage.getItem("admin_account")); }
    loadEarthquakeList();
    loadChat();
    setInterval(loadChat, 3000);
};

function showToast(text) {
    let t = document.getElementById("toast");
    t.innerText = text;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 1800);
}

function updateUserStatus(text) {
    let s = document.getElementById("user_status");
    s.innerHTML = text ? `<div class="status logged-in">✓ ${text}</div>` : "";
}

function updateAdminStatus(text) {
    let s = document.getElementById("admin_status");
    s.innerHTML = text ? `<div class="status logged-in">✓ ${text}</div>` : "";
}

// ========================== 地震列表 ==========================
function loadEarthquakeList() {
    fetch("http://127.0.0.1:5000/api/earthquake/list")
    .then(res => res.json())
    .then(data => {
        let c = document.getElementById("eq_list_container");
        if (!data.data || data.data.length === 0) {
            c.innerHTML = `<div class="empty-tip">暂无数据</div>`;
            return;
        }
        let html = "";
        data.data.forEach(item => {
            html += `
            <div class="eq-item">
                <div class="eq-title">${item.province_name} · ${item.magnitude}级</div>
                <div class="eq-meta">时间：${item.earthquake_time} | ID：${item.earthquake_id}<br>
                经纬度：${item.latitude},${item.longitude} | 深度：${item.depth}km<br>
                描述：${item.earthquake_message || '-'}</div>
            </div>`;
        });
        c.innerHTML = html;
    });
}

// ========================== 用户 ==========================
function userReg() {
    let acc = document.getElementById("user_account").value;
    let pwd = document.getElementById("user_pwd").value;
    fetch("http://127.0.0.1:5000/api/user/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_account: acc, password: pwd })
    }).then(res => res.json()).then(d => showToast(d.msg));
}

function userLogin() {
    let acc = document.getElementById("user_account").value;
    let pwd = document.getElementById("user_pwd").value;
    fetch("http://127.0.0.1:5000/api/user/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_account: acc, password: pwd }),
        credentials: "include"
    }).then(res => res.json()).then(d => {
        if (d.code === 200) {
            currentUserToken = d.data.user_token;
            localStorage.setItem("user_token", currentUserToken);
            localStorage.setItem("user_account", d.data.user_account);
            updateUserStatus(d.data.user_account);
        }
        showToast(d.msg);
    });
}

function userLogout() {
    fetch("http://127.0.0.1:5000/api/user/logout", {
        method: "POST", credentials: "include"
    }).then(() => {
        currentUserToken = null;
        localStorage.clear();
        updateUserStatus(null);
        showToast("已登出");
    });
}

// ========================== 管理员 ==========================
function adminReg() {
    let acc = document.getElementById("admin_account").value;
    let pwd = document.getElementById("admin_pwd").value;
    let key = document.getElementById("admin_key").value;
    fetch("http://127.0.0.1:5000/api/admin/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admin_account: acc, password: pwd, admin_key: key })
    }).then(res => res.json()).then(d => showToast(d.msg));
}

function adminLogin() {
    let acc = document.getElementById("admin_account").value;
    let pwd = document.getElementById("admin_pwd").value;
    fetch("http://127.0.0.1:5000/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admin_account: acc, password: pwd }),
        credentials: "include"
    }).then(res => res.json()).then(d => {
        if (d.code === 200) {
            currentAdminToken = d.data.admin_token;
            localStorage.setItem("admin_token", currentAdminToken);
            localStorage.setItem("admin_account", d.data.admin_account);
            updateAdminStatus(d.data.admin_account);
        }
        showToast(d.msg);
    });
}

function adminLogout() {
    fetch("http://127.0.0.1:5000/api/admin/logout", {
        method: "POST", credentials: "include"
    }).then(() => {
        currentAdminToken = null;
        localStorage.clear();
        updateAdminStatus(null);
        showToast("已登出");
    });
}

// ========================== 地震管理 ==========================
function addEarthquake() {
    let p = document.getElementById("province_id").value;
    let t = document.getElementById("earthquake_time").value;
    let lat = document.getElementById("latitude").value;
    let lng = document.getElementById("longitude").value;
    let dep = document.getElementById("depth").value;
    let mag = document.getElementById("magnitude").value;
    let msg = document.getElementById("earthquake_message").value;
    fetch("http://127.0.0.1:5000/api/admin/earthquake/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            province_id: p, earthquake_time: t, latitude: lat, longitude: lng,
            depth: dep, magnitude: mag, earthquake_message: msg
        }),
        credentials: "include"
    }).then(res => res.json()).then(d => {
        showToast(d.msg);
        loadEarthquakeList();
    });
}

function updateEarthquake() {
    let id = document.getElementById("eq_id").value;
    fetch("http://127.0.0.1:5000/api/admin/earthquake/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            earthquake_id: id,
            province_id: document.getElementById("update_province").value,
            earthquake_time: document.getElementById("update_time").value,
            latitude: document.getElementById("update_lat").value,
            longitude: document.getElementById("update_lng").value,
            depth: document.getElementById("update_depth").value,
            magnitude: document.getElementById("update_mag").value,
            earthquake_message: document.getElementById("update_msg").value
        }),
        credentials: "include"
    }).then(res => res.json()).then(d => showToast(d.msg));
}

function deleteEarthquake() {
    let id = document.getElementById("eq_id").value;
    fetch("http://127.0.0.1:5000/api/admin/earthquake/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ earthquake_id: id }),
        credentials: "include"
    }).then(res => res.json()).then(d => showToast(d.msg));
}

// ========================== 订阅 & 预警 ==========================
function subscribe() {
    let pid = document.getElementById("sub_province_id").value;
    fetch("http://127.0.0.1:5000/api/user/subscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ province_id: pid }),
        credentials: "include"
    }).then(res => res.json()).then(d => showToast(d.msg));
}

function showMySubscriptions() {
    fetch("http://127.0.0.1:5000/api/user/subscriptions", { credentials: "include" })
    .then(res => res.json()).then(d => {
        let txt = "我的订阅：\n";
        d.data.forEach(i => txt += i.province_name + "\n");
        document.getElementById("result").innerText = txt;
    });
}

function showAlerts() {
    fetch("http://127.0.0.1:5000/api/user/alerts", { credentials: "include" })
    .then(res => res.json()).then(d => {
        let txt = "我的预警：\n";
        d.data.forEach(i => txt += i.province_name + " " + i.magnitude + "级\n");
        document.getElementById("result").innerText = txt;
    });
}

// ========================== 聊天室 ==========================
function sendChat() {
    let content = document.getElementById("chat_msg").value.trim();
    if (!content) return;
    fetch("http://127.0.0.1:5000/api/user/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content }),
        credentials: "include"
    }).then(() => {
        document.getElementById("chat_msg").value = "";
        loadChat();
    });
}

function loadChat() {
    fetch("http://127.0.0.1:5000/api/user/chat/list", { credentials: "include" })
    .then(res => res.json())
    .then(d => {
        let box = document.getElementById("chat_box");
        box.innerHTML = "";
        d.data.forEach(item => {
            let div = document.createElement("div");
            div.innerText = `[${item.create_time}] ${item.username}：${item.content}`;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}

// ========================== 反馈 ==========================
function submitFeedback() {
    let type = document.getElementById("fb_type").value;
    let prio = document.getElementById("fb_priority").value;
    let content = document.getElementById("fb_content").value;
    fetch("http://127.0.0.1:5000/api/user/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ feedback_type: type, priority: prio, content: content }),
        credentials: "include"
    }).then(res => res.json()).then(d => {
        showToast(d.msg);
        if (d.code === 200) document.getElementById("fb_content").value = "";
    });
}
</script>
</body>
</html>
